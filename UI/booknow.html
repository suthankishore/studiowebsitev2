    <main class="premium-booking-section">
        <div class="premium-booking-card">
            <div class="premium-booking-header">
                <h1>Book Your Cinematic Experience</h1>
                <p>Fill out the form below to reserve your date and discuss your vision.</p>
            </div>
            <form id="dedicatedBookingForm" class="premium-booking-form">
                <div class="premium-form-row">
                    <div class="premium-form-group">
                        <label for="name">Your Full Name</label>
                        <input type="text" id="name" name="name" placeholder="John Doe" required>
                    </div>
                    <div class="premium-form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="john.doe@example.com" required>
                    </div>
                </div>
                <div class="premium-form-row">
                    <div class="premium-form-group">
                        <label for="phone">WhatsApp Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required>
                    </div>
                    <div class="premium-form-group">
                        <label for="eventType">Type of Event</label>
                        <select id="eventType" name="eventType" required>
                            <option value="" disabled selected>Select Event Type</option>
                            <option value="Wedding">Wedding</option>
                            <option value="Engagement">Engagement</option>
                            <option value="Birthday">Birthday</option>
                            <option value="Corporate Event">Corporate Event</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="premium-form-row">
                    <div class="premium-form-group">
                        <label for="eventDate">Event Date</label>
                        <input type="date" id="eventDate" name="eventDate" required>
                    </div>
                    <div class="premium-form-group">
                        <label for="location">Event Location</label>
                        <input type="text" id="location" name="location" placeholder="City, Venue" required>
                    </div>
                </div>
                <div class="premium-form-group full-width">
                    <label for="message">Your Message / Specific Requirements</label>
                    <textarea id="message" name="message" rows="5" placeholder="Tell us more about your event..."></textarea>
                </div>
                <button type="submit" class="premium-submit-btn">Submit Booking Request</button>
                <p id="dedicatedBookingSuccess" class="success-msg"></p>
            </form>
        </div>
    </main>
