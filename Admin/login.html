<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | V2 Cinematic Studio</title>
    <meta name="description" content="Secure admin login for V2 Cinematic Studio.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="admin-login-page">
    <main class="admin-login-shell">
        <section class="admin-login-card" aria-labelledby="adminLoginTitle">
            <div class="admin-login-logo-wrap">
                <img src="../Assets/logo.png" alt="V2 Cinematic Studio logo" class="admin-login-logo">
            </div>

            <div class="admin-login-heading">
                <h1 id="adminLoginTitle">Admin Login</h1>
            </div>

            <form class="admin-login-form" id="adminLoginForm">
                <div class="admin-login-field">
                    <label for="adminEmail">Email</label>
                    <input type="email" id="adminEmail" name="email" placeholder="Email" autocomplete="email" required>
                </div>

                <div class="admin-login-field">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" name="password" placeholder="Password" autocomplete="current-password" required>
                </div>

                <p class="admin-login-error" id="adminLoginError" role="alert" aria-live="polite"></p>

                <button type="submit" class="admin-login-button" id="adminLoginButton">Login</button>
            </form>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="../JS/firebase.js"></script>
    <script src="../JS/script.js"></script>
</body>
</html>
