<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Client Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="admin-panel-page">
    <div class="admin-panel-shell">
        <aside class="admin-sidebar">
            <img src="../Assets/logo.png" alt="V2 Cinematic Studio Admin" class="admin-sidebar-logo">
            <nav class="admin-sidebar-nav">
                <a href="dashboard.html" class="admin-sidebar-link">Dashboard</a>
                <a href="bookings.html" class="admin-sidebar-link">Bookings</a>
                <a href="client-details.html" class="admin-sidebar-link active">Client Details</a>
                <a href="client-gallery-upload.html" class="admin-sidebar-link">Gallery Upload</a>
                <a href="selection-view.html" class="admin-sidebar-link">Selections</a>
                <button type="button" class="admin-sidebar-link admin-sidebar-logout" id="adminLogout">Logout</button>
            </nav>
        </aside>

        <main class="admin-main" id="adminClientDetailsRoot">
            <div class="admin-page-header">
                <h1>Client Details</h1>
                <p>Booked client records with token, contact, event date, and location.</p>
            </div>

            <div class="admin-panel-card" id="clientDetailsSelectedCard" hidden>
                <div class="admin-panel-card-header">
                    <h2>Selected Client</h2>
                </div>
                <div id="clientDetailsHighlight">
                    <p class="admin-empty-state">Loading client details...</p>
                </div>
                <p id="clientDetailsMessage" class="admin-form-message"></p>
            </div>

            <div class="admin-panel-card">
                <div class="admin-panel-card-header">
                    <h2>Booked Clients</h2>
                </div>
                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Mail</th>
                                <th>Phone</th>
                                <th>Event</th>
                                <th>Date</th>
                                <th>Location</th>
                                <th>Token</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="clientDetailsTableBody">
                            <tr>
                                <td colspan="9" class="admin-empty-row">Loading clients...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
    <script src="../JS/firebase.js"></script>
    <script src="../JS/admin.js"></script>
</body>
</html>
